services:
  scalp5-bot:
    build: .
    restart: unless-stopped        # comes back after crashes and server reboots
    env_file: .env
    volumes:
      - ./.state:/app/.state       # alert history + Upstox token file survive restarts
      - ./watchlist.yaml:/app/watchlist.yaml:ro
    # Subset example:
    # command: ["python", "-m", "scalpbot.bot", "--only", "NIFTY 50,BTC"]
