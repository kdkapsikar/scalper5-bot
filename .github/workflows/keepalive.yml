name: Keep the portal awake during market hours

# Render's free plan puts the portal to sleep after ~15 idle minutes; waking it takes 30-60 s. This pings it every
# 10 minutes on weekdays 08:30-16:30 IST (03:00-10:59 UTC), about 180 of the free plan's 750 hours a month.
# GitHub may run scheduled jobs a few minutes late, and pauses schedules in repos with no activity for 60 days.
# To ping a different address, set the Actions variable PORTAL_URL. To stop, disable this workflow in the Actions tab.

on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the portal
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://scalp5-portal.onrender.com/' }}
        run: |
          url="${PORTAL_URL%/}/_stcore/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url") && [ "$code" = "200" ] && { echo "awake ($code)"; exit 0; }
            echo "attempt $i: HTTP ${code:-none}, retrying"; sleep 10
          done
          echo "::warning::The portal did not answer at $url"
