name: Deploy landing page to GitHub Pages

# Publishes the static landing page in site/ (the portal itself runs on Render, see README "Hosting").
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The "Open the portal" buttons point at https://scalp5-portal.onrender.com/. To point them elsewhere (e.g. a custom
# domain), add Settings -> Secrets and variables -> Actions -> Variables -> PORTAL_URL and re-run this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the buttons at PORTAL_URL (if set)
        if: ${{ vars.PORTAL_URL != '' }}
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          url="${PORTAL_URL%/}/"
          sed -i "s#https://scalp5-portal.onrender.com/#${url}#g" site/index.html
          echo "::notice::Buttons point at ${url}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
