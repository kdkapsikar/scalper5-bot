name: Deploy web app to GitHub Pages

# Builds the React app in web/ and publishes it. The API runs on Render (render.yaml).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The app calls the API at https://scalp5-portal.onrender.com; to use another address, add the Actions variable API_URL.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.API_URL || 'https://scalp5-portal.onrender.com' }}
      VITE_BASE: /${{ github.event.repository.name }}/
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # GitHub Pages serves 404.html for unknown paths; a copy of index.html lets deep links such as
      # /scalper5-bot/app/scanner or the Upstox redirect (/upstox/callback) load the app, which then routes itself.
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
