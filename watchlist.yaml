# What the scanner app and the alert bot watch.
#
# universe: built automatically
#   index_futures  NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY, NIFTYNXT50 futures (Upstox, nearest expiry)
#   stock_futures  every NSE F&O stock future (Upstox, nearest expiry). The Upstox instrument list is
#                  downloaded once a day, so contracts roll to the next expiry on their own.
#   crypto         CoinSwitch PRO futures symbols (BTC, ETH, PAXG, XAUUSDT). Run
#                  `python -m scalpbot.check` once to confirm each symbol exists on CoinSwitch.
#   oanda          OANDA forex & metals (needs an OANDA API token), e.g. [XAU_USD, XAG_USD, EUR_USD]
#   mcx            optional MCX commodity futures by underlying, e.g. [GOLDM, SILVERM, CRUDEOIL]
#   roll_days      move to next month's contract this many days before expiry (0 = nearest expiry)
#   only / exclude limit or skip stock futures by underlying name, e.g. only: [RELIANCE, TCS, SBIN]
#
# instruments: extra hand-picked entries (optional), for example
#   - {name: "GOLD MINI", source: upstox, segment: MCX_FO, underlying: GOLDM}
#   - {name: "SBIN", source: upstox, instrument_key: "NSE_EQ|INE062A01020", params: {rsi_long: [40, 65]}}

universe:
  index_futures: true
  stock_futures: true
  mcx: [GOLD, GOLDM, SILVER, SILVERM, CRUDEOIL, CRUDEOILM, NATURALGAS, NATGASMINI, COPPER, ZINC, ALUMINIUM, LEAD]
  crypto: [BTCUSDT, ETHUSDT, PAXGUSDT, XAUUSDT]
  oanda: [XAU_USD]
  roll_days: 0
  only: []
  exclude: []

instruments: []
